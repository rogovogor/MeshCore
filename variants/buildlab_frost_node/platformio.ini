; BuildLab Frost Node - ESP32-S3 (N16R8) + E22-900M30S.
; Stationary repeater with INA3221 current monitoring on three rails
; (10 mOhm shunts on channels 1 and 2, 100 mOhm on channel 3).
[BuildLab_Frost_Node]
extends = esp32_base
board = esp32-s3-n16r8
build_flags =
  ${esp32_base.build_flags}
  ${sensor_base.build_flags}
  -I variants/buildlab_frost_node
  -D BUILDLAB_FROST_NODE
  ; --- LoRa (E22-900M30S / SX1262) ---
  -D P_LORA_DIO_1=42
  -D P_LORA_NSS=14
  -D P_LORA_RESET=40
  -D P_LORA_BUSY=41
  -D P_LORA_SCLK=15
  -D P_LORA_MISO=39
  -D P_LORA_MOSI=38
  -D SX126X_TXEN=16
  -D SX126X_RXEN=17
  ; --- peripherals ---
  -D PIN_VBAT_READ=1
  -D PIN_USER_BTN=0
  -D PIN_BUZZER=5
  -D PIN_BOARD_SDA=8
  -D PIN_BOARD_SCL=18
  -D BATTERY_ADC_MULTIPLIER=4.05f
  ; --- GPS (u-blox): ESP RX=GPIO13, ESP TX=GPIO12, enable on GPIO11 ---
  -D PIN_GPS_TX=13
  -D PIN_GPS_RX=12
  -D PIN_GPS_EN=11
  -D GPS_BAUD_RATE=38400
  -D ENV_SKIP_GPS_DETECT=1
  ; --- INA3221 shunts: 10 mOhm on channels 1-2, 100 mOhm on channel 3 ---
  -D TELEM_INA3221_SHUNT_CH0=0.010
  -D TELEM_INA3221_SHUNT_CH1=0.010
  -D TELEM_INA3221_SHUNT_CH2=0.100
  ; --- radio (E22 external TXEN/RXEN -> no DIO2) ---
  -D SX126X_DIO3_TCXO_VOLTAGE=1.8
  -D SX126X_CURRENT_LIMIT=140
  -D USE_SX1262
  -D RADIO_CLASS=CustomSX1262
  -D WRAPPER_CLASS=CustomSX1262Wrapper
  -D LORA_TX_POWER=22
  -D SX126X_RX_BOOSTED_GAIN=1
build_src_filter = ${esp32_base.build_src_filter}
  +<../variants/buildlab_frost_node>
  +<helpers/sensors>
  +<helpers/ui/buzzer.cpp>
lib_deps =
  ${esp32_base.lib_deps}
  ${sensor_base.lib_deps}
  adafruit/Adafruit SSD1306 @ ^2.5.13
  end2endzone/NonBlockingRTTTL@^1.3.0

[env:BuildLab_Frost_Node_companion_radio_ble]
extends = BuildLab_Frost_Node
build_flags =
  ${BuildLab_Frost_Node.build_flags}
  -I examples/companion_radio/ui-new
  -D DISPLAY_CLASS=SSD1306Display
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D UI_SENSORS_PAGE=1
  -D WITH_COMPANION_CLI
  -DDISPLAY_TZ=\"MSK-3\"
  -D CYRILLIC_SUPPORT=1
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
build_src_filter = ${BuildLab_Frost_Node.build_src_filter}
  +<helpers/esp32/*.cpp>
  +<helpers/ui/SSD1306Display.cpp>
  +<helpers/ui/MomentaryButton.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${BuildLab_Frost_Node.lib_deps}
  densaugeo/base64 @ ~1.4.0

; --- Repeater build: relays traffic and serves INA3221 telemetry on request ---
[env:BuildLab_Frost_Node_repeater]
extends = BuildLab_Frost_Node
build_flags =
  ${BuildLab_Frost_Node.build_flags}
  -D DISPLAY_CLASS=SSD1306Display
  -D ADVERT_NAME='"Frost Node Repeater"'
  -D ADVERT_LAT=0.0
  -D ADVERT_LON=0.0
  -D ADMIN_PASSWORD='"password"'
  -D MAX_NEIGHBOURS=50
  -D AUTO_REBOOT_MS=172800000   ; scheduled reboot every 48 hours
build_src_filter = ${BuildLab_Frost_Node.build_src_filter}
  +<helpers/ui/SSD1306Display.cpp>
  +<../examples/simple_repeater>
lib_deps =
  ${BuildLab_Frost_Node.lib_deps}
  ${esp32_ota.lib_deps}
