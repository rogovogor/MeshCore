; Асинхронный вариант: панель ведёт GxEPD2 с неблокирующим обновлением, поэтому
; радио и BLE не ждут окончания волновой формы. Панель E290 — DEPG0290BNS800F6,
; ей соответствует класс GxEPD2_290_BS (адаптер AsyncGxEPD290BS).
[env:Heltec_E290_companion_radio_ble_async]
extends = Heltec_E290_base
build_flags =
  ${Heltec_E290_base.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=GxEPDDisplay
  -D WITH_ASYNC_EINK=1
  -D EINK_DISPLAY_MODEL=GxEPD2_290_BS
  -D EINK_LOGICAL_W=296
  -D EINK_LOGICAL_H=128
  -D EINK_SCALE_X=1.0f
  -D EINK_SCALE_Y=1.0f
  -D EINK_X_OFFSET=0
  -D EINK_Y_OFFSET=0
  -D PIN_DISPLAY_CS=3
  -D PIN_DISPLAY_DC=4
  -D PIN_DISPLAY_RST=5
  -D PIN_DISPLAY_BUSY=6
  -D PIN_DISPLAY_SCLK=2
  -D PIN_DISPLAY_MOSI=1
  -D PIN_DISPLAY_MISO=-1
  -D EINK_SPI_BUS=HSPI
  -D WITH_COMPANION_CLI
  -D AUTO_OFF_MILLIS=0
  -D BLE_PIN_CODE=123456
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D CYRILLIC_SUPPORT=1
build_src_filter = ${Heltec_E290_base.build_src_filter}
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/ui/VectorFont.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_E290_base.lib_deps}
  zinggjm/GxEPD2 @ 1.6.4
  bakercp/CRC32 @ ^2.0.0
  densaugeo/base64 @ ~1.4.0

; Асинхронный e-ink + энергосбережение. Нужно ядро с CONFIG_PM_ENABLE
; (см. docs/esp32-companion-power-saving.md); на Windows оно ставится поверх
; штатного пакета, поэтому platform_packages здесь нет.
[env:Heltec_E290_companion_radio_ble_async_ps]
extends = env:Heltec_E290_companion_radio_ble_async
build_flags =
  ${env:Heltec_E290_companion_radio_ble_async.build_flags}
  -D WITH_ESP32_POWER_SAVING=1
  -D EINK_ASYNC_LOG=1

; Асинхронный e-ink, экран повёрнут на 180°. GxEPDDisplay берёт поворот из префов,
; поэтому поворот по умолчанию задаёт EINK_DEFAULT_ROTATION (ui_display_rotation, MyMesh.cpp).
[env:Heltec_E290_screen_180_companion_radio_ble_async]
extends = env:Heltec_E290_companion_radio_ble_async
build_flags =
  ${env:Heltec_E290_companion_radio_ble_async.build_flags}
  -D DISPLAY_ROTATION=1
  -D EINK_DEFAULT_ROTATION=1

[env:Heltec_E290_screen_180_companion_radio_ble_async_ps]
extends = env:Heltec_E290_screen_180_companion_radio_ble_async
build_flags =
  ${env:Heltec_E290_screen_180_companion_radio_ble_async.build_flags}
  -D WITH_ESP32_POWER_SAVING=1
  -D EINK_ASYNC_LOG=1
