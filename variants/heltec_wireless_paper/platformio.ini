; Асинхронный e-ink: панель ведёт AsyncHeltec213, ревизия панели (V1.1 или
; V1.1.1/V1.2) определяется при старте. Пины — из heltec-eink-modules
; (Platforms/WirelessPaper). Радио на FSPI, панель — на HSPI.
[env:Heltec_Wireless_Paper_companion_radio_ble_async]
extends = Heltec_Wireless_Paper_base
build_flags =
  ${Heltec_Wireless_Paper_base.build_flags}
  -I examples/companion_radio/ui-new
  -D MAX_CONTACTS=350
  -D MAX_GROUP_CHANNELS=40
  -D DISPLAY_CLASS=GxEPDDisplay
  -D WITH_ASYNC_EINK=1
  -D EINK_DISPLAY_MODEL=AsyncHeltec213
  -D EINK_LOGICAL_W=250
  -D EINK_LOGICAL_H=122
  -D EINK_SCALE_X=1.0f
  -D EINK_SCALE_Y=1.0f
  -D EINK_X_OFFSET=0
  -D EINK_Y_OFFSET=0
  -D PIN_DISPLAY_CS=4
  -D PIN_DISPLAY_DC=5
  -D PIN_DISPLAY_RST=6
  -D PIN_DISPLAY_BUSY=7
  -D PIN_DISPLAY_SCLK=3
  -D PIN_DISPLAY_MOSI=2
  -D PIN_DISPLAY_MISO=-1
  -D EINK_SPI_BUS=HSPI
  -DDISPLAY_TZ=\"MSK-3\"
  -D WITH_COMPANION_CLI
  -D AUTO_OFF_MILLIS=0
  -D BLE_PIN_CODE=123456   ; dynamic, random PIN
  -D BLE_DEBUG_LOGGING=1
  -D OFFLINE_QUEUE_SIZE=256
  -D CYRILLIC_SUPPORT=1
build_src_filter = ${Heltec_Wireless_Paper_base.build_src_filter}
  +<helpers/ui/GxEPDDisplay.cpp>
  +<helpers/ui/VectorFont.cpp>
  +<helpers/esp32/*.cpp>
  +<../examples/companion_radio/*.cpp>
  +<../examples/companion_radio/ui-new/*.cpp>
lib_deps =
  ${Heltec_Wireless_Paper_base.lib_deps}
  zinggjm/GxEPD2 @ 1.6.4
  densaugeo/base64 @ ~1.4.0
  bakercp/CRC32 @ ^2.0.0

; Асинхронный e-ink + энергосбережение. Нужно ядро с CONFIG_PM_ENABLE
; (см. docs/esp32-companion-power-saving.md).
[env:Heltec_Wireless_Paper_companion_radio_ble_async_ps]
extends = env:Heltec_Wireless_Paper_companion_radio_ble_async
build_flags =
  ${env:Heltec_Wireless_Paper_companion_radio_ble_async.build_flags}
  -D WITH_ESP32_POWER_SAVING=1
  -D EINK_ASYNC_LOG=1
